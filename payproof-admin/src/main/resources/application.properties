spring.application.name=payproof-admin
server.port=${PORT:8080}
server.address=0.0.0.0

spring.session.jdbc.initialize-schema=never

# ---- Datasource (same Postgres as PayProof) ----
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

payproof.bootstrap.admin-id=${BOOTSTRAP_ADMIN_ID:}
payproof.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
payproof.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
payproof.bootstrap.admin-first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
payproof.bootstrap.admin-last-name=${BOOTSTRAP_ADMIN_LAST_NAME:User}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.session.timeout=30m
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
spring.config.import=optional:file:.env[.properties]
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:PayProof <no-reply@payproof.site>}
payproof.app-url=${PAYPROOF_APP_URL:https://www.payproof.site/}
payproof.frontend-url=${PAYPROOF_FRONTEND_URL:https://app.payproof.site

# ---- No Flyway ----
spring.flyway.enabled=false

# ---- JWT session ----
payproof.jwt.secret=${JWT_SECRET}
payproof.jwt.session-ttl-minutes=30
payproof.jwt.issuer=payproof-dispute-service


# ---- NEAR reads via JSON-RPC ----
payproof.near.rpc-url=${NEAR_RPC_URL:https://rpc.testnet.near.org}
payproof.near.contract-id=${CONTRACT_ID:payproof-escrowdavid.testnet}
payproof.near.network-id=${NEAR_NETWORK:testnet}
payproof.near.resolver-account=${RESOLVER_ACCOUNT:payproof-serverdavid.testnet}

# ---- Signer sidecar (writes only) ----
payproof.sidecar.base-url=${SIDECAR_URL}
payproof.sidecar.secret=${SIDECAR_SECRET}
payproof.sidecar.timeout-ms=30000

# ---- Reconciler ----
payproof.reconciler.interval-ms=10000

cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket=${R2_BUCKET}

# ---- Logging ----
logging.level.com.payproof.dispute=INFO
logging.level.org.springframework.web.reactive.function.client=WARN

payproof.cookie.secure=${COOKIE_SECURE:false}