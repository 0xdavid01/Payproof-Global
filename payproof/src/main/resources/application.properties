spring.application.name=payproof
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
spring.config.import=optional:file:.env[.properties]
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:PayProof <no-reply@payproof.site>}
payproof.app-url=${PAYPROOF_APP_URL:https://www.payproof.site/}
payproof.frontend-url=${PAYPROOF_FRONTEND_URL:https://app.payproof.site}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email

cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket=${R2_BUCKET}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.2

server.error.include-message=always
server.error.include-stacktrace=always


server.error.include-message=always
server.error.include-stacktrace=always

# NEAR Testnet Configuration
# NEAR Testnet
near.network=testnet
near.rpc-url=https://rpc.testnet.near.org

near.escrow-contract-id=payproof-escrowdavid.testnet
near.admin-contract-id=payproof-admindavid.testnet
near.server-account-id=payproof-serverdavid.testnet

near.usdt-contract-id=${NEAR_USDT_CONTRACT_ID:usdt-stub.payproof-serverdavid.testnet}

near.usdc-contract-id=3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af
near.usdc-decimals=6

