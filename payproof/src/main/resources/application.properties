near.network=testnet
near.rpc-url=https://rpc.testnet.near.org

near.escrow-contract-id=payproof-escrowdavid.testnet
near.admin-contract-id=payproof-admindavid.testnet
near.server-account-id=payproof-serverdavid.testnet

near.usdt-contract-id=${NEAR_USDT_CONTRACT_ID:usdt-stub.payproof-serverdavid.testnet}

